name: hetu_script_dev_tools
description: Extensions for Hetu Script dart package. Includes file system resource context helper class and command line REPL for Hetu Script.
version: 0.8.0
homepage: https://github.com/hetu-script/hetu-script
publish_to: none

executables:
  hetu: cli_tool

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  path: ^1.8.0
  args: ^2.1.0
  http: ^1.2.0
  pub_semver: ^2.1.1
  # hetu_script: ^0.7.1
  hetu_script:
    path: ../hetu_script
  analyzer: ^14.7.0
  source_gen: ^4.3.1
  code_builder: ^4.13.0
  build: ^5.0.0

dev_dependencies:
  build_runner: ^2.17.1
  build_test: ^3.5.23
  lints: ^5.1.0
  test: ^1.31.2
